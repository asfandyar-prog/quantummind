# Railway service config for the QuantumMind backend.
#
# This file lives in backend/, so the Railway service must have its
# Root Directory set to "backend". Paths below are relative to that.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run here, not in an entrypoint script. preDeployCommand runs once
# per deploy in this same image, before the new version receives traffic, and a
# non-zero exit aborts the rollout — so a failed migration leaves the previous
# version serving instead of booting a server against a half-migrated schema.
#
# An entrypoint script would instead run on every container start (restarts and
# scale-ups included), letting replicas race each other on `alembic upgrade
# head`, and would turn a migration failure into a crash loop rather than a
# clean "deploy failed".
#
# Note: alembic/env.py imports app.core.config, which validates the full
# settings model — so this command needs the LLM provider vars set too, not
# just DATABASE_URL. See DEPLOY.md.
preDeployCommand = ["alembic upgrade head"]

# GET /health returns 200 reading only in-process settings — it makes no
# Postgres, Redis or Groq call. It is still a meaningful readiness gate:
# app/main.py's lifespan verifies Postgres and Redis before the server
# accepts traffic, so if either is down the process exits and this check
# never answers. A 200 therefore means "startup completed and dependencies
# were reachable at boot".
healthcheckPath = "/health"

# Generous: the first boot downloads the all-MiniLM-L6-v2 embedding model
# and imports torch, which is slow on a cold container.
healthcheckTimeout = 300

# Restart on crash, but stop after 10 tries so a genuinely broken deploy
# (bad env var, unreachable database) fails visibly instead of looping.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
